  for(let i=0;i<p.count;i++){p.setY(i,hf(p.getX(i),p.getZ(i)))}g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.receiveShadow=true;return m}

// ===== 1. Great Wall =====
{const S=mkScene({sky:[0x5d8fd6,0xf3d9b0],fog:0xd9cdb5,fogD:[40,260],sun:[-.5,.35,-.6],sunCol:0xffe2b0,sunI:2.6,amb:.9,hemi:[0xcfe3ff,0x6b5a3a]});const g=S.g;
 const ridge=x=>8*Math.sin(x*0.055)+4*Math.sin(x*.13+1);const pathZ=x=>14*Math.sin(x*.035);

   if(Math.round(x)%24===0){box(g,4,6,4,stone,x,y+2,z);box(g,4.6,.6,4.6,dark,x,y+5.2,z);for(let k=0;k<4;k++){const a=k*Math.PI/2;box(g,1,1,1,dark,x+Math.cos(a)*1.9,y+6,z+Math.sin(a)*1.9)}}
   prev=p}

 S.cam=(p)=>{const x=-70+p*95;const z=pathZ(x);return{pos:[x-8,hf(x,z)+16-p*6,z+30-p*8],look:[x+30,hf(x+30,pathZ(x+30))+2,pathZ(x+30)]}};

// ===== 2. Petra =====
{const S=mkScene({sky:[0x3e6db8,0xf2b98a],fog:0xd99a72,fogD:[30,220],sun:[.6,.55,.5],sunCol:0xffc890,sunI:3,amb:.8,hemi:[0xffd7b8,0x7a3c2a]});const g=S.g;
 const rose=M(0xc8775a),rose2=M(0xb3624a),rose3=M(0xdb9172);

{const S=mkScene({sky:[0x2d6ed6,0xbfe3ff],fog:0xcfe6ff,fogD:[60,420],sun:[-.5,.55,-.7],sunCol:0xfff0d8,sunI:3.2,amb:1,hemi:[0xdff0ff,0x3d6a3a]});const g=S.g;
