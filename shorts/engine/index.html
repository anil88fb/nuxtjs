<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>

  #black{background:#000;opacity:0}
  #top{position:absolute;left:72px;right:72px;top:150px}

  #badge b{display:inline-block;width:70px;height:3px;background:var(--acc)}
  #title{font:800 104px/1.02 'Inter Display';margin-top:24px;letter-spacing:-2px;text-shadow:0 8px 40px rgba(0,0,0,.6)}
  #title span{display:inline-block}
  #loc{font:500 40px/1.3 'Inter';margin-top:22px;color:rgba(255,255,255,.92);text-shadow:0 2px 16px rgba(0,0,0,.9)}
  #card{position:absolute;left:60px;right:60px;bottom:200px;padding:42px 46px 20px;border-radius:40px;
        background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.26);
        box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
  .fact{display:flex;gap:26px;align-items:flex-start;margin-bottom:24px}
  .fact .k{flex:0 0 72px;height:72px;border-radius:22px;background:color-mix(in srgb,var(--acc) 18%,transparent);border:1.5px solid var(--acc);
           display:flex;align-items:center;justify-content:center;font:700 30px 'Inter';color:var(--acc)}
  .fact .t{font:500 39px/1.28 'Inter';color:#fff}
  .fact .t strong{color:var(--acc);font-weight:700}
  #dots{position:absolute;left:0;right:0;bottom:115px;display:flex;justify-content:center;gap:18px}
  #dots div{width:16px;height:16px;border-radius:9px;background:rgba(255,255,255,.35)}
  #dots div.on{width:56px;background:var(--acc)}

  .h2{font:500 44px/1.35 'Inter';color:rgba(255,255,255,.88);margin-top:34px}
  .pill{margin-top:50px;font:700 34px 'Inter';padding:20px 40px;border-radius:60px;border:2px solid var(--acc);color:var(--acc);letter-spacing:2px;text-transform:uppercase}
  #introBox{margin-top:-120px}
</style></head>

    const hp = new THREE.Group(), mp = new THREE.Group(); g.add(hp, mp); mesh(new THREE.BoxGeometry(.5, 4.6, .3), glow(P.b, 2), hp, 0, 2.2, .9); mesh(new THREE.BoxGeometry(.32, 6.8, .3), glow(0xffffff, 2), mp, 0, 3.3, 1.1); mesh(new THREE.SphereGeometry(.6, 16, 12), std(P.a, { m: .9 }), g, 0, 0, 1.2);
    return t => { mp.rotation.z = -t * 1.6; hp.rotation.z = -t * 1.6 / 12; g.rotation.y = Math.sin(t * .5) * .35 } },
  mountain(g, P) { const geo = new THREE.PlaneGeometry(44, 44, 70, 70); geo.rotateX(-Math.PI / 2); const p = geo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); const d = Math.hypot(x, z); p.setY(i, Math.max(0, 12 - d * .75) + 1.2 * Math.sin(x * .6) * Math.cos(z * .5) + 2 * Math.exp(-((x - 9) ** 2 + (z + 5) ** 2) / 20) * 3) }
    geo.computeVertexNormals(); mesh(geo, std(P.a, { flat: true, r: .9, m: 0 }), g, 0, -9, 0); const sun = mesh(new THREE.SphereGeometry(2.4, 24, 16), glow(P.b, 3), g, -9, 10, -14); points(g, 200, () => [(rnd() - .5) * 40, rnd() * 20 - 6, (rnd() - .5) * 40], 0xffffff, .5);
    return t => { g.rotation.y = t * .12 } },
  ocean(g, P) { const geo = new THREE.PlaneGeometry(50, 50, 80, 80); geo.rotateX(-Math.PI / 2); const base = geo.attributes.position.array.slice(); const sea = mesh(geo, std(P.a, { flat: true, r: .2, m: .4, e: P.a, ei: .15 }), g, 0, -6, 0);
    const fish = []; for (let i = 0; i < 18; i++) fish.push(mesh(new THREE.ConeGeometry(.35, 1.4, 6), glow(P.b, 2), g));
    return t => { const a = geo.attributes.position; for (let i = 0; i < a.count; i++) { const x = base[i * 3], z = base[i * 3 + 2]; a.setY(i, 1.3 * Math.sin(x * .3 + t * 1.6) + .9 * Math.cos(z * .35 + t * 1.2) + .4 * Math.sin((x + z) * .8 + t * 2.5)) } a.needsUpdate = true; geo.computeVertexNormals();
      fish.forEach((f, i) => { const k = t * .7 + i * .35; f.position.set(Math.cos(k) * (5 + i % 4), -1 + Math.sin(k * 2 + i) * 2 + (i % 3) * 2, Math.sin(k) * (5 + i % 4)); f.rotation.set(0, -k, Math.PI / 2) }) } },
  rocket(g, P) { const R = new THREE.Group(); g.add(R); const body = std(0xeef0f4, { m: .5, r: .3 }); mesh(new THREE.CylinderGeometry(1.6, 1.6, 8, 32), body, R, 0, 0, 0); mesh(new THREE.ConeGeometry(1.6, 3.4, 32), std(P.a, { m: .5 }), R, 0, 5.7, 0);
    mesh(new THREE.CylinderGeometry(.75, .75, .3, 24), glow(P.c, 1.5), R, 0, 1.8, 1.5).rotation.x = Math.PI / 2; for (let i = 0; i < 3; i++) { const f = mesh(new THREE.BoxGeometry(.25, 3, 2.2), std(P.a), R, 0, -3.2, 0); f.rotation.y = i / 3 * Math.PI * 2; f.translateZ(1.8) }
    mesh(new THREE.CylinderGeometry(1.1, 1.5, 1, 24), std(0x555a66, { m: .9 }), R, 0, -4.5, 0); const flame = mesh(new THREE.ConeGeometry(1.2, 6, 24), glow(P.b, 3.5), R, 0, -8, 0); flame.rotation.x = Math.PI;
    const smoke = points(g, 400, () => [(rnd() - .5) * 3, -rnd() * 30, (rnd() - .5) * 3], 0xffddb0, 1.6, .5); const stars = points(g, 400, () => [(rnd() - .5) * 60, (rnd() - .5) * 60, -10 - rnd() * 30], 0xffffff, .6);
    return (t, lt) => { const y = -2 + lt * 1.2; R.position.y = Math.sin(t * 20) * .05; flame.scale.set(1 + .15 * Math.sin(t * 30), 1 + .25 * Math.sin(t * 23), 1); smoke.position.y = -8 + ((t * 8) % 6); stars.position.y = -((t * 6) % 30) + 15; R.rotation.z = .12 } },
  heart(g, P) { const s = new THREE.Shape(); s.moveTo(0, -3); s.bezierCurveTo(-6, 2, -3.4, 7, 0, 4.4); s.bezierCurveTo(3.4, 7, 6, 2, 0, -3); const geo = new THREE.ExtrudeGeometry(s, { depth: 2.4, bevelEnabled: true, bevelSize: .7, bevelThickness: .7, bevelSegments: 6, curveSegments: 32 }); geo.center();
    const h = mesh(geo, std(P.a, { e: P.a, ei: .5, r: .25 }), g); h.rotation.z = 0; const ecg = []; for (let i = 0; i <= 120; i++) { const x = -14 + i * 28 / 120; const k = (i % 40) / 40; let y = 0; if (k > .4 && k < .45) y = 3; else if (k > .45 && k < .5) y = -2; else if (k > .35 && k < .4) y = -.6; ecg.push(new THREE.Vector3(x, y - 9, 2)) }
    const tube = mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ecg), 300, .12, 6), glow(P.c, 2.6), g);
    return (t, lt) => { const b = Math.pow(Math.max(0, Math.sin(t * 7.5)), 8); h.scale.setScalar(1.05 + b * .12); h.rotation.y = Math.sin(t * .8) * .5; tube.geometry.setDrawRange(0, Math.floor(clamp(((t * .5) % 1.2) / 1) * tube.geometry.index.count / 3) * 3) } },
  pyramid(g, P) { const sand = std(P.a, { flat: true, r: .9, m: 0 }); for (const [x, z, s] of [[0, 0, 1], [-11, -6, .65], [10, -9, .5]]) { const p = mesh(new THREE.ConeGeometry(8 * s, 9 * s, 4), sand, g, x, -6 + 4.5 * s, z); p.rotation.y = Math.PI / 4 }
    const ground = mesh(new THREE.CircleGeometry(30, 48), std(P.b, { r: 1, m: 0 }), g, 0, -6, 0); ground.rotation.x = -Math.PI / 2; mesh(new THREE.SphereGeometry(2, 24, 16), glow(0xfff0c0, 3), g, 8, 10, -18);
    points(g, 300, () => [(rnd() - .5) * 40, rnd() * 14 - 6, (rnd() - .5) * 40], 0xffe0a0, .6); return t => { g.rotation.y = t * .15 } },
  city(g, P) { const bs = []; for (let x = -4; x <= 4; x++) for (let z = -4; z <= 4; z++) { if (rnd() < .2) continue; const h = 2 + Math.pow(rnd(), 2) * 16 * (1 - Math.hypot(x, z) / 7); const b = mesh(new THREE.BoxGeometry(1.7, 1, 1.7), std(0x2a3346, { m: .7, r: .35, e: rnd() < .3 ? P.a : P.c, ei: .08 }), g, x * 2.4, 0, z * 2.4); bs.push({ b, h: Math.max(1, h), d: Math.hypot(x, z) }) }
    const plane = mesh(new THREE.PlaneGeometry(26, 26), std(0x0c0f18), g, 0, -8, 0); plane.rotation.x = -Math.PI / 2; const cars = points(g, 120, () => [(rnd() - .5) * 22, -7.8, Math.round((rnd() - .5) * 8) * 2.4 + 1.2], P.b, .6, 1);
    return (t, lt) => { bs.forEach(({ b, h, d }) => { const k = eout((lt - .1 - d * .08) / 1) * h + .01; b.scale.y = k; b.position.y = -8 + k / 2 }); cars.position.x = (t * 3) % 2.4; g.rotation.y = t * .18 } },
  dice(g, P) { const ds = []; for (let i = 0; i < 6; i++) { const d = mesh(new THREE.BoxGeometry(3, 3, 3), std(i % 2 ? P.a : 0xffffff, { r: .3, m: .1 }), g); const pips = new THREE.Group(); d.add(pips); for (let f = 0; f < 6; f++) { const n = f + 1; for (let k = 0; k < n; k++) { const p = mesh(new THREE.SphereGeometry(.22, 8, 6), std(0x111111), pips); const u = (k % 3 - 1) * .8, v = (Math.floor(k / 3) - .5) * .8 * (n > 3 ? 1 : 0); const pos = [[u, v, 1.5], [u, v, -1.5], [1.5, u, v], [-1.5, u, v], [u, 1.5, v], [u, -1.5, v]][f]; p.position.set(...pos) } } ds.push({ d, ph: rnd() * 6, r: 4 + rnd() * 5, sp: .4 + rnd() * .5 }) }
    return t => ds.forEach(({ d, ph, r, sp }, i) => { const a = t * sp + i; d.position.set(Math.cos(a) * r, Math.sin(t * 1.3 + ph) * 4, Math.sin(a) * r); d.rotation.set(t * 1.1 + ph, t * .9, t * .5) }) },
};
window.MOTIF_NAMES = Object.keys(MOTIFS);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
const camera = new THREE.PerspectiveCamera(50, 1080 / 1920, .1, 2000);
const composer = new EffectComposer(renderer); const rp = new RenderPass(new THREE.Scene(), camera); composer.addPass(rp);
const bloom = new UnrealBloomPass(new THREE.Vector2(540, 960), .5, .45, .88); composer.addPass(bloom); composer.addPass(new OutputPass());

function skyMesh(top, bot, glowC) { return new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: col(top) }, bot: { value: col(bot) }, gc: { value: col(glowC) } },
  vertexShader: `varying vec3 vp;void main(){vp=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `uniform vec3 top,bot,gc;varying vec3 vp;void main(){float h=clamp(vp.y*1.2+.45,0.,1.);vec3 c=mix(bot,top,h);c+=gc*.22*pow(max(0.,1.-abs(vp.y+.05)*2.2),3.);gl_FragColor=vec4(c,1.);}` })) }

function buildScene(motif, pal) {
  const s = new THREE.Scene(); s.add(skyMesh(pal.skyTop, pal.skyBot, pal.a)); s.fog = new THREE.Fog(pal.skyBot, 45, 140);
  const L = new THREE.DirectionalLight(0xffffff, 2.4); L.position.set(15, 25, 20); L.castShadow = true; L.shadow.mapSize.set(1024, 1024); const sc = L.shadow.camera; sc.left = sc.bottom = -25; sc.right = sc.top = 25; s.add(L);
  const L2 = new THREE.PointLight(pal.a, 120, 60); L2.position.set(-14, 6, 10); s.add(L2); const L3 = new THREE.PointLight(pal.c, 90, 60); L3.position.set(14, -4, -8); s.add(L3);
  s.add(new THREE.HemisphereLight(0xdfe8ff, 0x202030, .9));
  const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: pal.skyBot, roughness: .35, metalness: .6 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -10.5; floor.receiveShadow = true; s.add(floor);
  const grid = new THREE.PolarGridHelper(40, 16, 10, 64, pal.a, pal.a); grid.material.transparent = true; grid.material.opacity = .18; grid.position.y = -10.45; s.add(grid);
  const dust = points(s, 500, () => [(rnd() - .5) * 90, (rnd() - .5) * 60, (rnd() - .5) * 90], pal.c, .7, .7);
  const g = new THREE.Group(); s.add(g); const fn = (MOTIFS[motif] || MOTIFS.art)(g, pal) || (() => { });
  return { s, g, front: FRONT.has(motif), upd: (t, lt) => { fn(t, lt); dust.rotation.y = t * .03 } } }

const FRONT = new Set(['chart', 'gears', 'clock', 'book', 'bulb', 'heart', 'rocket', 'city', 'coins']);
const PALS = [ // fallback palettes
  { a: 0x52b8ff, b: 0xff5fa2, c: 0x8af0ff, skyTop: 0x050b1e, skyBot: 0x112a55 },
  { a: 0xffc84a, b: 0xff7a3d, c: 0xfff1b0, skyTop: 0x120a02, skyBot: 0x3a2508 },
  { a: 0x7cff9e, b: 0x3dd6ff, c: 0xd8ffe0, skyTop: 0x03140c, skyBot: 0x0b3a2a },
  { a: 0xc08bff, b: 0xff6bd6, c: 0xe6d0ff, skyTop: 0x0c0420, skyBot: 0x2a1250 },
  { a: 0xff6b6b, b: 0xffd166, c: 0xffe3e3, skyTop: 0x1a0505, skyBot: 0x4a1515 },
];
const hx = v => typeof v === 'string' ? parseInt(v.replace('#', ''), 16) : v;
const scenes = items.map((it, i) => { const p = Object.assign({}, PALS[i % PALS.length], Object.fromEntries(Object.entries(it.palette || {}).map(([k, v]) => [k, hx(v)]))); return buildScene(it.visual, p) });
const introS = buildScene(C.introVisual || items[0].visual, Object.assign({}, PALS[0], Object.fromEntries(Object.entries(C.introPalette || items[0].palette || {}).map(([k, v]) => [k, hx(v)]))));
const outroS = buildScene(C.outroVisual || 'globe', Object.assign({}, PALS[3], Object.fromEntries(Object.entries(C.outroPalette || {}).map(([k, v]) => [k, hx(v)]))));

// ---------- UI ----------
const $ = id => document.getElementById(id);
const dots = $('dots'); for (let i = 0; i < items.length; i++) dots.appendChild(document.createElement('div'));
$('i0').textContent = C.category || ''; $('i1').innerHTML = C.hook; $('i2').innerHTML = C.hookSub || '';
$('o1').innerHTML = C.outro?.title || 'Which one surprised you?'; $('o2').innerHTML = C.outro?.sub || ''; $('o3').innerHTML = C.outro?.cta || 'Follow for a new one every day';
const pad = n => String(n).padStart(2, '0');
let curUI = -1;
function setUI(i) { if (curUI === i) return; curUI = i; const it = items[i]; $('num').textContent = `${C.badge || 'FACT'} ${pad(i + 1)} / ${pad(items.length)}`;
  $('title').innerHTML = it.title.split(' ').map(w => `<span>${w}</span>`).join(' ');
  $('title').style.fontSize = it.title.length > 26 ? '84px' : it.title.length > 16 ? '96px' : '112px';
  $('loc').innerHTML = it.sub || ''; $('card').innerHTML = it.facts.map((f, k) => `<div class="fact"><div class="k">${k + 1}</div><div class="t">${f}</div></div>`).join('');
  [...dots.children].forEach((d, k) => d.className = k === i ? 'on' : '') }
const st = (el, o, ty = 0, sc = 1, blur = 0) => { el.style.opacity = o; el.style.transform = `translateY(${ty}px) scale(${sc})`; el.style.filter = blur ? `blur(${blur}px)` : '' };
function orbit(t, p, r0 = 58, h0 = 6, dir = 1, a0 = .5) { const a = a0 + dir * p * 1.3; const r = r0 - p * 8; camera.position.set(Math.sin(a) * r, h0 + p * 6 - 3, Math.cos(a) * r); camera.lookAt(0, -3 - p * 1, 0) }

window.renderAt = function (t) {
  const flash = $('flash'), black = $('black'), dim = $('dim'); flash.style.opacity = 0; black.style.opacity = 0;
  const sceneUI = $('scene'), intro = $('intro'), outro = $('outro'); let S, lt;
  if (t < T_INTRO) { lt = t; S = introS; sceneUI.style.opacity = 0; intro.style.opacity = 1; outro.style.opacity = 0; orbit(t, lt / T_INTRO * .6, 66, 4, 1, -.4); dim.style.opacity = .5;
    st($('i0'), eout(lt / .5), 30 * (1 - eout(lt / .5))); st($('i1'), eout((lt - .25) / .7), 0, .7 + .3 * eback((lt - .25) / .8), 18 * (1 - eout((lt - .25) / .6))); st($('i2'), eout((lt - 1.1) / .6), 30 * (1 - eout((lt - 1.1) / .6)));
    flash.style.opacity = clamp((lt - (T_INTRO - .25)) / .25) * .85 }
  else if (t >= TOTAL - T_OUTRO) { lt = t - (TOTAL - T_OUTRO); S = outroS; sceneUI.style.opacity = 0; intro.style.opacity = 0; outro.style.opacity = 1; orbit(t, lt / T_OUTRO * .5, 70, 2, -1, .3); dim.style.opacity = .5;
    st($('o1'), eout(lt / .6), 40 * (1 - eout(lt / .6))); st($('o2'), eout((lt - .5) / .6), 30 * (1 - eout((lt - .5) / .6))); st($('o3'), eout((lt - 1.1) / .5), 0, .8 + .2 * eback((lt - 1.1) / .5));
    flash.style.opacity = clamp(1 - lt / .35) * .85; black.style.opacity = clamp((lt - (T_OUTRO - .6)) / .6) }
  else { intro.style.opacity = 0; outro.style.opacity = 0; sceneUI.style.opacity = 1; const i = Math.min(items.length - 1, Math.floor((t - T_INTRO) / T_SCENE)); lt = t - T_INTRO - i * T_SCENE; const p = lt / T_SCENE; setUI(i); S = scenes[i];
    S.front ? orbit(t, (ease(p) * .8 + p * .2) * .55, 58, 7, i % 2 ? -1 : 1, i % 2 ? .35 : -.35) : orbit(t, ease(p) * .8 + p * .2, 60, 7, i % 2 ? -1 : 1, i * 1.3); dim.style.opacity = 0;
    flash.style.opacity = clamp(1 - lt / .35) * .85; if (lt > T_SCENE - .25 && i < items.length - 1) flash.style.opacity = clamp((lt - (T_SCENE - .25)) / .25) * .85;
    [...$('title').children].forEach((s, k) => { const q = eout((lt - .25 - k * .07) / .5); s.style.opacity = q; s.style.transform = `translateY(${(1 - q) * 70}px)` });
    st($('badge'), eout((lt - .1) / .4), -20 * (1 - eout((lt - .1) / .4))); st($('loc'), eout((lt - .7) / .5), 20 * (1 - eout((lt - .7) / .5)));
    const cardIn = eout((lt - 1.1) / .6); st($('card'), cardIn, 120 * (1 - cardIn));
    const gap = (T_SCENE - 2.6) / 3; [...$('card').children].forEach((f, k) => { const q = eout((lt - 1.5 - k * gap) / .5); f.style.opacity = q; f.style.transform = `translateX(${(1 - q) * -60}px)` });
    const out = clamp((lt - (T_SCENE - .45)) / .35); if (i < items.length - 1 && out > 0) sceneUI.style.opacity = 1 - out }
  camera.fov = 52 - 6 * eout(lt / 1.2); camera.updateProjectionMatrix();
  S.upd(t, lt); rp.scene = S.s; composer.render();
};
window.ready = true;
</script></body></html>
